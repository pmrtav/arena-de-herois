<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Arena de Heróis</title>
<style>
:root{--bg:#0d0f17;--panel:#171a27;--panel2:#20253a;--gold:#f2c14e;--txt:#e9ecf5;--mute:#8a92ad;--red:#e5533d;--blue:#6a7cff;--green:#3dbd6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,#1a1e30 0%,#0a0b12 80%)}
#cv{width:min(100vw,calc(100vh*1.6));width:min(100vw,calc(100dvh*1.6));aspect-ratio:16/10;height:auto;display:block;background:#111;box-shadow:0 0 60px #000a;cursor:crosshair}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:16px;background:rgba(8,9,15,.78);backdrop-filter:blur(3px);z-index:10;overflow:auto}
.screen.hidden{display:none}
.screen>:first-child{margin-top:auto}.screen>:last-child{margin-bottom:auto}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,7vw,72px);margin:0;letter-spacing:.06em;color:var(--gold);text-shadow:0 4px 0 #6b4a0a,0 0 40px #f2c14e55;text-align:center;line-height:1}
h2{font-family:Georgia,serif;font-size:clamp(26px,4.5vw,44px);margin:0;color:var(--gold);text-align:center}
.sub{color:var(--mute);margin:0;text-align:center}
.btn{font:inherit;font-weight:700;font-size:clamp(16px,2.4vw,22px);color:var(--txt);background:linear-gradient(#2b3150,#1c2038);border:2px solid #3b4268;border-radius:12px;padding:12px 28px;min-width:min(320px,80vw);cursor:pointer;transition:transform .08s,border-color .12s,background .12s}
.btn:hover,.btn:focus-visible{border-color:var(--gold);background:linear-gradient(#37406a,#232846);outline:none;transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(#f2c14e,#c58f1e);color:#241800;border-color:#ffe08a}
.btn.primary:hover{background:linear-gradient(#ffd877,#d79b22)}
.shoprow{display:flex;align-items:center;gap:14px;width:100%;background:var(--panel);border:1px solid #2b3150;border-radius:12px;padding:10px 14px}
.shoprow .ico{font-size:28px;width:36px;text-align:center}.shoprow>div:nth-child(2){flex:1}.shoprow small{display:block;color:var(--mute);font-size:13px}
.shoprow .own{color:var(--mute);font-size:14px;white-space:nowrap}.shoprow .own b{color:var(--txt)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
#potBar{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:150px;display:flex;gap:8px;pointer-events:auto}
.pbtn{width:50px;height:50px;border-radius:12px;border:2px solid #ffffff55;background:#0008;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;line-height:1.05;touch-action:none}
.pbtn b{font-size:12px}
.btn.sel{border-color:var(--gold);background:linear-gradient(#4a3f1e,#2c2610);color:var(--gold)}
.btn.small{min-width:0;padding:8px 18px;font-size:16px}
.btn.danger{border-color:#7a2d2d;color:#ff9c8c}
.col{display:flex;flex-direction:column;gap:12px;align-items:center}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--panel2);border:1px solid #333a5a;border-radius:999px;padding:6px 16px;color:var(--mute);font-size:15px}
.chip b{color:var(--txt)}
.card{width:200px;background:var(--panel);border:3px solid #2b3150;border-radius:16px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-3px)}
.card.locked canvas{filter:grayscale(1) brightness(.4)}.card.locked{cursor:not-allowed;opacity:.8}.lockmsg{color:var(--gold)!important;font-weight:600}
.card.sel{border-color:var(--gold);box-shadow:0 0 28px #f2c14e44}
.card canvas{width:100%;background:radial-gradient(circle,#2a3050,#12141f);border-radius:10px}
.card h3{margin:2px 0 0;font-size:20px}
.card p{margin:0;color:var(--mute);font-size:13px;line-height:1.35;min-height:52px}
.lvlbar{display:flex;gap:3px}
.lvlbar i{flex:1;height:7px;border-radius:2px;background:#2b3150}
.lvlbar i.on{background:var(--gold)}
.stat{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.stat b{color:var(--txt)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:20px;width:min(420px,88vw);background:var(--panel);padding:12px 16px;border-radius:10px;border:1px solid #2b3150}
.setrow input[type=range]{width:160px;accent-color:var(--gold)}
.setrow input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold)}
.diffbtn{display:flex;flex-direction:column;align-items:center;gap:2px}
.diffbtn small{font-weight:400;color:#c9cde0;font-size:13px}
.primary .diffbtn small,.btn.primary small{color:#4a3500}
#result .big{font-size:clamp(40px,8vw,84px);font-family:Georgia,serif;font-weight:700}
#result .win{color:var(--gold)}#result .lose{color:#ff7a66}
.lvlup{color:var(--green);font-weight:700;font-size:clamp(18px,3vw,26px);text-align:center}
.hint{font-size:13px;color:var(--mute);text-align:center;max-width:520px}
.portraithint{display:none}
@media (orientation:portrait) and (pointer:coarse){.portraithint{display:block}}

/* touch controls */
#touch{position:fixed;inset:0;z-index:5;pointer-events:none;display:none}
#touch.on{display:block}
#joy{position:absolute;left:0;bottom:0;width:50%;height:65%;pointer-events:auto;touch-action:none}
#joyBase,#joyKnob{position:absolute;border-radius:50%;pointer-events:none;display:none}
#joyBase{width:120px;height:120px;border:3px solid #ffffff44;background:#ffffff14;margin:-60px 0 0 -60px}
#joyKnob{width:56px;height:56px;background:#ffffff66;margin:-28px 0 0 -28px}
.tbtn{position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;display:grid;place-items:center;font-weight:800;color:#fff;border:3px solid #ffffff66;background:#ffffff1f;font-size:15px}
.tbtn:active,.tbtn.down{background:#ffffff55}
#btnAtk{right:max(22px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));width:104px;height:104px;background:#e5533d55}
#btnSp{right:max(138px,calc(env(safe-area-inset-right) + 116px));bottom:max(40px,env(safe-area-inset-bottom));width:78px;height:78px;background:#6a7cff55}
#btnSp .cdv{position:absolute;inset:0;border-radius:50%;background:#000a;clip-path:inset(0 0 0 0)}
#pauseBtn{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:6;display:none;padding:4px 16px;border-radius:999px;border:1px solid #ffffff44;background:#0008;color:#fff;font-size:14px;cursor:pointer}
#pauseBtn.on{display:block}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

<div id="touch">
  <div id="joy"></div><div id="joyBase"></div><div id="joyKnob"></div>
  <div id="potBar"><div class="pbtn" data-i="0"></div><div class="pbtn" data-i="1"></div><div class="pbtn" data-i="2"></div><div class="pbtn" data-i="3"></div></div>
  <div class="tbtn" id="btnSp">ESPECIAL</div>
  <div class="tbtn" id="btnAtk">ATACAR</div>
</div>
<button id="pauseBtn">⏸ Pausa (Esc)</button>

<!-- MENU PRINCIPAL -->
<div class="screen" id="s-menu">
  <h1>ARENA DE<br>HERÓIS</h1>
  <div class="chip" id="heroChip"></div>
  <div class="col">
    <button class="btn primary" id="bPlay">Começar jogo</button>
    <button class="btn" id="bChar">Escolher personagem</button>
    <button class="btn" id="bShop">Loja</button>
    <button class="btn" id="bSet">Settings</button>
    <button class="btn" id="bQuit">Sair do jogo</button>
  </div>
  <p class="hint portraithint">Dica: joga com o telemóvel na horizontal.</p>
</div>

<!-- ESCOLHER PERSONAGEM -->
<div class="screen hidden" id="s-char">
  <h2>Escolhe o teu herói</h2>
  <p class="sub">Cada herói tem o seu próprio nível. Vence bots para o fazer subir.</p>
  <p class="sub" id="progLine"></p>
  <div class="row" id="catTabs" style="gap:8px;max-width:760px"></div>
  <div class="row" id="cards"></div>
  <button class="btn" id="bCharBack">← Voltar</button>
</div>

<!-- DIFICULDADE -->
<div class="screen hidden" id="s-diff">
  <h2>Dificuldade</h2>
  <p class="sub" id="diffHero"></p>
  <p class="sub" style="margin-top:4px">Arena</p>
  <div class="row" id="arenaRow" style="gap:8px;max-width:640px"></div>
  <div class="col">
    <button class="btn" data-diff="easy"><span class="diffbtn">Fácil<small>Bot lento e distraído · +1 nível · +30 🪙</small></span></button>
    <button class="btn" data-diff="normal"><span class="diffbtn">Normal<small>Bot esquiva e usa habilidades · +1 nível · +60 🪙</small></span></button>
    <button class="btn" data-diff="hard"><span class="diffbtn">Difícil<small>Bot rápido, prevê os teus movimentos · +2 níveis · +120 🪙</small></span></button>
    <button class="btn small" id="bDiffBack">← Voltar</button>
  </div>
</div>

<!-- LOJA -->
<div class="screen hidden" id="s-shop">
  <h2>Loja</h2>
  <div class="chip" id="shopCoins"></div>
  <div class="row" id="shopTabs" style="gap:8px"><button class="btn small sel" data-tab="pot">🧪 Poções</button><button class="btn small" data-tab="arm">🛡 Armaduras</button></div>
  <div id="shopBody" class="col" style="width:min(560px,92vw)"></div>
  <p class="hint" id="shopMsg"></p>
  <button class="btn" id="bShopBack">← Voltar</button>
</div>

<!-- SETTINGS -->
<div class="screen hidden" id="s-set">
  <h2>Settings</h2>
  <div class="setrow"><label for="setVol">Volume</label><input type="range" id="setVol" min="0" max="100"></div>
  <div class="setrow"><label for="setSfx">Efeitos sonoros</label><input type="checkbox" id="setSfx"></div>
  <div class="setrow"><label for="setTouch">Controlos touch</label><input type="checkbox" id="setTouch"></div>
  <button class="btn danger small" id="bReset">Apagar progresso</button>
  <button class="btn" id="bSetBack">← Voltar</button>
</div>

<!-- PAUSA -->
<div class="screen hidden" id="s-pause">
  <h2>Pausa</h2>
  <div class="col">
    <button class="btn primary" id="bResume">Retomar</button>
    <button class="btn danger" id="bGiveUp">Desistir (volta ao menu)</button>
  </div>
</div>

<!-- RESULTADO -->
<div class="screen hidden" id="result">
  <div class="big" id="resTitle"></div>
  <div class="lvlup" id="resLvl"></div>
  <p class="sub" id="resSub"></p>
  <div class="col">
    <button class="btn primary" id="bAgain">Jogar outra vez</button>
    <button class="btn" id="bResChar">Trocar de herói</button>
    <button class="btn" id="bResShop">Loja</button>
    <button class="btn" id="bResMenu">Menu principal</button>
  </div>
</div>

<!-- DESPEDIDA -->
<div class="screen hidden" id="s-bye">
  <h1>Até à próxima!</h1>
  <p class="sub">Já podes fechar o separador. O teu progresso está guardado.</p>
  <button class="btn" id="bByeBack">Voltar ao menu</button>
</div>

<script>
(() => {
'use strict';
const W = 960, H = 600;
const AR = { x: 40, y: 70, w: 880, h: 500 };
const ARENAS = {
  classic: { name: 'Clássica', pillars: [{ x: 340, y: 320, r: 40 }, { x: 620, y: 320, r: 40 }], haz: [],
    th: { top: '#2b2f45', bot: '#222639', line: 'rgba(255,255,255,.045)', mid: 'rgba(242,193,78,.12)', border: '#4b5280', p0: '#8a90ab', p1: '#4a5069', ps: '#2a2e44' } },
  graveyard: { name: 'Cemitério', tomb: true, haz: [],
    pillars: [{ x: 250, y: 180, r: 20 }, { x: 250, y: 460, r: 20 }, { x: 400, y: 260, r: 20 }, { x: 400, y: 380, r: 20 }, { x: 560, y: 260, r: 20 }, { x: 560, y: 380, r: 20 }, { x: 710, y: 180, r: 20 }, { x: 710, y: 460, r: 20 }],
    th: { top: '#2a3330', bot: '#1b2321', line: 'rgba(160,200,170,.05)', mid: 'rgba(150,220,170,.10)', border: '#56705f', p0: '#a3ada5', p1: '#5b655e', ps: '#2b332e' } },
  lava: { name: 'Lava', pillars: [{ x: 480, y: 320, r: 30 }], haz: [{ x: 480, y: 168, r: 46 }, { x: 480, y: 472, r: 46 }],
    th: { top: '#35262a', bot: '#241a1d', line: 'rgba(255,160,120,.05)', mid: 'rgba(255,120,60,.12)', border: '#8a4a3a', p0: '#6f5d5d', p1: '#3b3030', ps: '#1c1414' } },
  ice: { name: 'Gelo', ice: true, haz: [],
    pillars: [{ x: 400, y: 215, r: 30 }, { x: 560, y: 215, r: 30 }, { x: 400, y: 425, r: 30 }, { x: 560, y: 425, r: 30 }],
    th: { top: '#2c4560', bot: '#223548', line: 'rgba(200,240,255,.09)', mid: 'rgba(200,240,255,.14)', border: '#6fa8c8', p0: '#d8f0ff', p1: '#7fb0d0', ps: '#35607a' } },
  open: { name: 'Aberta', pillars: [], haz: [],
    th: { top: '#3a3226', bot: '#2b261d', line: 'rgba(255,230,170,.05)', mid: 'rgba(255,220,140,.12)', border: '#8a7448', p0: '#8a90ab', p1: '#4a5069', ps: '#2a2e44' } },
};
let ARENA = ARENAS.classic, PILLARS = ARENA.pillars, HAZ = ARENA.haz;
function setArena(k) { ARENA = ARENAS[k] || ARENAS.classic; PILLARS = ARENA.pillars; HAZ = ARENA.haz; }
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const SC = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * SC; cv.height = H * SC;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };

/* ---------- SAVE ---------- */
const SAVE_KEY = 'arena-herois-v1';
const ALL = ['warrior', 'mage', 'archer', 'ninja', 'paladin', 'druid', 'bomber', 'pyro', 'cryo', 'electro', 'necro', 'illusion', 'shadow', 'arcane', 'wind', 'geo', 'chrono'];
const save = { levels: Object.fromEntries(ALL.map(k => [k, 1])), selected: 'warrior', arena: 'random', coins: 0,
  potions: { fury: 0, speed: 0, regen: 0, reflex: 0 }, armor: Object.fromEntries(ALL.map(k => [k, 0])),
  settings: { volume: 0.6, sfx: true, touch: ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) } };
try {
  const o = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if (o) {
    for (const k of ALL) if (Number.isFinite(o.levels?.[k])) save.levels[k] = clamp(Math.round(o.levels[k]), 1, 10);
    if (ALL.includes(o.selected)) save.selected = o.selected;
    if (Number.isFinite(o.coins)) save.coins = Math.max(0, Math.floor(o.coins));
    for (const p of ['fury', 'speed', 'regen', 'reflex']) if (Number.isFinite(o.potions?.[p])) save.potions[p] = clamp(Math.round(o.potions[p]), 0, 9);
    for (const k of ALL) if (Number.isFinite(o.armor?.[k])) save.armor[k] = clamp(Math.round(o.armor[k]), 0, 4);
    if (o.arena === 'random' || Object.prototype.hasOwnProperty.call(ARENAS, o.arena)) save.arena = o.arena;
    if (o.settings) {
      if (Number.isFinite(o.settings.volume)) save.settings.volume = clamp(o.settings.volume, 0, 1);
      if (typeof o.settings.sfx === 'boolean') save.settings.sfx = o.settings.sfx;
      if (typeof o.settings.touch === 'boolean') save.settings.touch = o.settings.touch;
    }
  }
} catch (e) {}
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

/* ---------- AUDIO ---------- */
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type = 'square', vol = .15, slide = 0, delay = 0) {
  if (!save.settings.sfx || save.settings.volume <= 0) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  const v = Math.max(.0002, vol * save.settings.volume);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .03);
}
const SFX = {
  swing: () => tone(300, .12, 'sawtooth', .12, -150),
  fire: () => tone(200, .22, 'sawtooth', .12, 300),
  arrow: () => tone(900, .08, 'triangle', .1, -500),
  dash: () => tone(150, .25, 'sawtooth', .15, 400),
  tp: () => { tone(500, .15, 'sine', .15, 800); tone(1200, .15, 'sine', .1, -800, .1); },
  hit: () => tone(160, .15, 'square', .2, -100),
  volley: () => { for (let i = 0; i < 4; i++) tone(700 + i * 60, .07, 'triangle', .08, -300, i * .03); },
  win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .2, 'square', .13, 0, i * .12)),
  lose: () => [400, 330, 260, 200].forEach((f, i) => tone(f, .25, 'sawtooth', .13, 0, i * .15)),
  lvl: () => [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, .15, 'triangle', .15, 0, .5 + i * .08)),
  click: () => tone(600, .05, 'square', .08),
  count: () => tone(440, .12, 'square', .1),
  go: () => tone(880, .3, 'square', .12),
};

/* ---------- CLASSES / DIFFICULTY ---------- */
const CLASSES = {
  warrior: { cat: 'armas', name: 'Guerreiro', color: '#e5533d', hp: 160, speed: 185, r: 20,
    basic: { cd: .5, dmg: 16, range: 78, arc: Math.PI * .9 }, special: { cd: 4.5, dmg: 26, name: 'Investida' },
    desc: 'Corpo a corpo brutal. Investida: avança e atropela o inimigo.' },
  mage: { cat: 'magia', name: 'Mago', color: '#6a7cff', hp: 110, speed: 165, r: 17,
    basic: { cd: .8, dmg: 25, speed: 380 }, special: { cd: 4, name: 'Teleporte' },
    desc: 'Bolas de fogo poderosas. Teleporte: salta para longe do perigo.' },
  archer: { cat: 'armas', name: 'Arqueiro', color: '#3dbd6b', hp: 90, speed: 200, r: 16,
    basic: { cd: .32, dmg: 9, speed: 700 }, special: { cd: 5, dmg: 8, name: 'Rajada' },
    desc: 'Rápido e ágil. Rajada: dispara 5 flechas em leque.' },
  ninja: { cat: 'armas', name: 'Ninja', color: '#d946a8', hp: 80, speed: 235, r: 15,
    basic: { cd: .26, dmg: 7, speed: 620 }, special: { cd: 3.5, name: 'Passo sombra' },
    desc: 'Velocíssimo e frágil. Passo sombra: esquiva curta e invulnerável.' },
  paladin: { cat: 'divino', name: 'Paladino', color: '#e0b43a', hp: 220, speed: 140, r: 22,
    basic: { cd: .9, dmg: 22, range: 85 }, special: { cd: 7, name: 'Escudo' },
    desc: 'Tanque lento. Martelo em área e escudo que corta 75% do dano.' },
  druid: { cat: 'natureza', name: 'Druida', color: '#2fb5a8', hp: 110, speed: 175, r: 17,
    basic: { cd: .65, dmg: 8, speed: 480 }, special: { cd: 11, name: 'Cura' },
    desc: 'Espinhos que abrandam o inimigo. Cura 35% da vida em 3 segundos.' },
  bomber: { cat: 'armas', name: 'Bombardeiro', color: '#f08a2a', hp: 105, speed: 170, r: 17,
    basic: { cd: 1.1, dmg: 24, speed: 340 }, special: { cd: 6, dmg: 40, name: 'Bomba' },
    desc: 'Lança minas que explodem ao contacto e uma bomba grande com atraso.' },
  pyro: { cat: 'magia', name: 'Piromante', color: '#c4361b', hp: 105, speed: 170, r: 17,
    basic: { cd: .55, dmg: 10, speed: 430 }, special: { cd: 7, dmg: 20, name: 'Anel de chamas' },
    desc: 'Brasas que queimam durante 3s. Anel de chamas: explosão à volta que incendeia.' },
  cryo: { cat: 'magia', name: 'Criomante', color: '#8fe0ff', hp: 125, speed: 168, r: 17,
    basic: { cd: .48, dmg: 12, speed: 560 }, special: { cd: 8, dmg: 14, name: 'Congelar' },
    desc: 'Estilhaços que abrandam. Congelar: prende quem estiver perto durante 1,5s.' },
  electro: { cat: 'magia', name: 'Eletromante', color: '#f5e43a', hp: 85, speed: 185, r: 16,
    basic: { cd: .6, dmg: 8, speed: 0 }, special: { cd: 7, dmg: 12, name: 'Investida elétrica' },
    desc: 'Relâmpago instantâneo que salta para invocações. Investida que atordoa.' },
  necro: { cat: 'magia', name: 'Necromante', color: '#8a5fb8', hp: 95, speed: 165, r: 17,

    } else drawFighter(ctx, { x: m.x, y: m.y, r: m.r, cls: m.owner.cls, aim: m.aim, flash: 0, swing: 0 }, G.time, .5);
    if (m.hp < m.maxhp) { ctx.fillStyle = '#0008'; ctx.fillRect(m.x - 12, m.y - m.r - 9, 24, 4); ctx.fillStyle = '#ffe08a'; ctx.fillRect(m.x - 12, m.y - m.r - 9, 24 * clamp(m.hp / m.maxhp, 0, 1), 4); }
  }
  for (const m of G.bombs) {
    const col = m.owner.c.color;
    if (m.kind === 'mine') {
      const armed = m.armed <= 0; ctx.fillStyle = '#1b1d2a'; ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(m.x, m.y, 10, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = armed ? (Math.sin(G.time * 12) > 0 ? '#ff4040' : '#802020') : '#888'; ctx.beginPath(); ctx.arc(m.x, m.y, 4, 0, 7); ctx.fill();
    } else {
      const k = 1 - m.fuse / 1.2; ctx.fillStyle = `rgba(255,80,40,${.12 + .12 * k})`; ctx.strokeStyle = 'rgba(255,120,60,.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(m.x, m.y, m.rad, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(m.x, m.y, 12, 0, 7); ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#ffe08a'; ctx.beginPath(); ctx.arc(m.x + 7, m.y - 12, 3 + Math.sin(G.time * 30), 0, 7); ctx.fill();
    }
  }
  for (const q of G.projs) {
    if (q.type === 'lob') { ctx.fillStyle = '#1b1d2a'; ctx.strokeStyle = '#ffb347'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(q.x, q.y, 7, 0, 7); ctx.fill(); ctx.stroke(); }
    else if (q.type === 'star') { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(G.time * 20); ctx.fillStyle = '#e6e9f5'; ctx.beginPath(); for (let i = 0; i < 8; i++) { const rad = i % 2 ? 2.5 : 7, an = i * Math.PI / 4; ctx.lineTo(Math.cos(an) * rad, Math.sin(an) * rad); } ctx.closePath(); ctx.fill(); ctx.restore(); }
    else if (q.type === 'thorn') { const a = Math.atan2(q.vy, q.vx); ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(a); ctx.fillStyle = '#6fe08a'; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-6, -5); ctx.lineTo(-3, 0); ctx.lineTo(-6, 5); ctx.closePath(); ctx.fill(); ctx.restore(); }
    else if (PSTYLE[q.type]) {
      const st = PSTYLE[q.type], a = Math.atan2(q.vy, q.vx); ctx.save(); ctx.translate(q.x, q.y);
      if (st.s === 'orb') { ctx.fillStyle = st.c + '55'; ctx.beginPath(); ctx.arc(0, 0, q.r + 5, 0, 7); ctx.fill(); ctx.fillStyle = st.c; ctx.beginPath(); ctx.arc(0, 0, q.r, 0, 7); ctx.fill(); ctx.fillStyle = st.k; ctx.beginPath(); ctx.arc(0, 0, q.r * .5, 0, 7); ctx.fill(); }
      else if (st.s === 'dia') { ctx.rotate(a); ctx.fillStyle = st.c; ctx.beginPath(); ctx.moveTo(q.r * 2.2, 0); ctx.lineTo(0, -q.r); ctx.lineTo(-q.r * 1.6, 0); ctx.lineTo(0, q.r); ctx.closePath(); ctx.fill(); ctx.strokeStyle = st.k; ctx.lineWidth = 1.5; ctx.stroke(); }
      else if (st.s === 'rect') { ctx.rotate(G.time * 15); ctx.fillStyle = st.c; ctx.strokeStyle = st.k; ctx.lineWidth = 1.5; ctx.fillRect(-5, -7, 10, 14); ctx.strokeRect(-5, -7, 10, 14); }
      else { ctx.rotate(a); ctx.strokeStyle = st.c; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(-q.r * .5, 0, q.r + 2, -1.1, 1.1); ctx.stroke(); ctx.strokeStyle = st.k; ctx.lineWidth = 2; ctx.stroke(); }
      ctx.restore();
    }
    else if (q.type === 'fire') { const g = ctx.createRadialGradient(q.x, q.y, 1, q.x, q.y, q.r + 6); g.addColorStop(0, '#fff6c8'); g.addColorStop(.5, '#ff9a3c'); g.addColorStop(1, 'rgba(255,100,40,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(q.x, q.y, q.r + 6, 0, 7); ctx.fill(); }
    else { const a = Math.atan2(q.vy, q.vx); ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(a); ctx.strokeStyle = '#e8e2c8'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(8, 0); ctx.stroke(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(6, -3.5); ctx.lineTo(6, 3.5); ctx.fill(); ctx.restore(); }
  }
  if (G.player && G.bot && G.state !== 'menu') {
    for (const f of [G.player, G.bot].sort((a, b) => a.y - b.y)) {
      drawFighter(ctx, f, G.time, f.hp > 0 ? (f.inv > 0 ? .4 : 1) : .3);
      if (f.hp > 0) { ctx.fillStyle = '#fff'; ctx.font = '700 11px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.globalAlpha = .85; ctx.fillText('Nv' + f.lvl, f.x, f.y - f.r - 8); ctx.globalAlpha = 1; }
    }
  }
  for (const q of G.texts) { ctx.globalAlpha = clamp(q.life / .4, 0, 1); ctx.fillStyle = q.col; ctx.font = '800 18px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.strokeText(q.txt, q.x, q.y); ctx.fillText(q.txt, q.x, q.y); }
  ctx.globalAlpha = 1; ctx.restore();
  if (G.state !== 'menu') drawHUD();
  if (G.state === 'countdown') {
    const n = G.cd > 1.9 ? '3' : G.cd > 1.2 ? '2' : G.cd > .5 ? '1' : 'LUTA!';
    bigText(n, n === 'LUTA!' ? '#f2c14e' : '#fff', n === 'LUTA!' ? 90 : 110);
    ctx.fillStyle = '#e9ecf5'; ctx.font = '700 20px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Arena: ' + ARENA.name + (ARENA.name === 'Lava' ? ' (evita as poças!)' : ARENA.ice ? ' (o chão escorrega!)' : ''), W / 2, H / 2 + 72);
    if (G.round === 1 && !save.settings.touch) { ctx.fillStyle = '#c9cde0'; ctx.font = '15px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillText('W frente · S trás · A/D lados · Rato apontar · Clique atacar · Espaço / botão direito = especial · Esc pausa', W / 2, H - 14); }
  }
  if (G.state === 'roundEnd') bigText(G.winner === G.player ? 'RONDA GANHA!' : 'RONDA PERDIDA', G.winner === G.player ? '#f2c14e' : '#ff7a66', 64);
}

/* ---------- LOOP ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  update(dt);
  if (!$('s-char').classList.contains('hidden')) {
    const t = now / 1000;
    for (const pv of previews) { pv.c.setTransform(1, 0, 0, 1, 0, 0); pv.c.clearRect(0, 0, 160, 120); pv.c.setTransform(1.45, 0, 0, 1.45, 0, 0); drawFighter(pv.c, { x: 36, y: 40, r: CLASSES[pv.k].r, cls: pv.k, aim: Math.sin(t * 1.5) * .5, flash: 0, swing: pv.k === 'warrior' && Math.sin(t * 3) > .9 ? .1 : 0 }, t); }
  }
  render(); requestAnimationFrame(frame);
}
showScreen('s-menu'); syncSettings();
requestAnimationFrame(frame);

// debug / test hooks
window.__dbg = { doSpecial, doAttack, aiThink, ALL, drinkIdx, POTIONS, ARMORS, renderShop, G, setArena, ARENAS, update, startMatch, DIFF, CLASSES, save, CKEYS, mkFighter, resetRound, endMatch, keys };
})();
